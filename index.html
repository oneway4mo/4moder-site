<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4moder — oneway4mo prime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background: #05070a;
            color: #f5f5f7;

            font-family:
                Inter,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            isolation: isolate;
        }

        /* =========================
           МЯГКОЕ ФОНОВОЕ СВЕЧЕНИЕ
           ========================= */

        body::before {
            content: "";

            position: fixed;
            inset: -25%;

            z-index: -2;

            background:
                radial-gradient(
                    circle at 25% 25%,
                    rgba(0, 145, 180, 0.14) 0%,
                    rgba(0, 145, 180, 0.06) 20%,
                    transparent 48%
                ),
                radial-gradient(
                    circle at 75% 70%,
                    rgba(45, 70, 130, 0.12) 0%,
                    rgba(45, 70, 130, 0.05) 22%,
                    transparent 50%
                );

            filter: blur(80px);

            animation: softAmbient 30s ease-in-out infinite;

            will-change: transform;
        }

        /* Второй слой делает движение ещё мягче */

        body::after {
            content: "";

            position: fixed;
            inset: -20%;

            z-index: -1;

            background:
                radial-gradient(
                    ellipse at 50% 50%,
                    rgba(0, 110, 145, 0.055),
                    transparent 55%
                );

            filter: blur(100px);

            animation: softAmbient2 42s ease-in-out infinite;

            will-change: transform;
        }

        @keyframes softAmbient {
            0% {
                transform: translate3d(-3%, -2%, 0) scale(1);
            }

            25% {
                transform: translate3d(2%, -4%, 0) scale(1.025);
            }

            50% {
                transform: translate3d(4%, 3%, 0) scale(1.05);
            }

            75% {
                transform: translate3d(-2%, 4%, 0) scale(1.025);
            }

            100% {
                transform: translate3d(-3%, -2%, 0) scale(1);
            }
        }

        @keyframes softAmbient2 {
            0% {
                transform: translate3d(3%, 2%, 0) scale(1);
            }

            50% {
                transform: translate3d(-4%, -3%, 0) scale(1.06);
            }

            100% {
                transform: translate3d(3%, 2%, 0) scale(1);
            }
        }

        /* =========================
           ОСНОВНАЯ КАРТОЧКА
           ========================= */

        .main-card {
            width: min(420px, calc(100vw - 32px));

            padding: 42px 34px;

            text-align: center;

            background: rgba(10, 13, 18, 0.72);

            border: 1px solid rgba(255, 255, 255, 0.07);

            border-radius: 24px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            position: relative;
            z-index: 2;
        }

        /* =========================
           АВАТАР
           ========================= */

        .avatar {
            width: 92px;
            height: 92px;

            margin: 0 auto 22px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(0, 130, 170, 0.08);
        }

        /* =========================
           ЗАГОЛОВОК
           ========================= */

        h1 {
            margin: 0;

            font-size: 32px;
            line-height: 1.1;

            font-weight: 700;

            letter-spacing: -0.8px;

            color: #ffffff;
        }

        .subtitle {
            margin-top: 11px;

            font-size: 15px;
            line-height: 1.5;

            color: rgba(245, 245, 247, 0.52);
        }

        /* =========================
           КНОПКИ
           ========================= */

        .buttons {
            display: flex;
            flex-direction: column;

            gap: 11px;

            margin-top: 30px;
        }

        .button {
            width: 100%;

            min-height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 18px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.075);

            background: rgba(255, 255, 255, 0.045);

            color: #ffffff;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.075);

            border-color: rgba(255, 255, 255, 0.13);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .button:active {
            transform: translateY(0);
        }

        /* =========================
           TWITCH КНОПКА
           ========================= */

        .button.primary {
            background: rgba(145, 70, 255, 0.15);

            border-color: rgba(145, 70, 255, 0.22);
        }

        .button.primary:hover {
            background: rgba(145, 70, 255, 0.22);

            border-color: rgba(145, 70, 255, 0.32);

            box-shadow:
                0 10px 35px rgba(145, 70, 255, 0.12);
        }

        /* =========================
           НИЖНИЙ ТЕКСТ
           ========================= */

        .footer {
            margin-top: 25px;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.24);

            letter-spacing: 0.2px;
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
           ========================= */

        @media (max-width: 480px) {
            .main-card {
                padding: 34px 24px;
                border-radius: 21px;
            }

            h1 {
                font-size: 28px;
            }

            .avatar {
                width: 82px;
                height: 82px;
            }
        }

        /* =========================
           ЕСЛИ У ПОЛЬЗОВАТЕЛЯ
           ОТКЛЮЧЕНЫ АНИМАЦИИ
           ========================= */

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after {
                animation: none;
            }

            .button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">

        <img
            src="logo.png"
            alt="4moder"
            class="avatar"
        >

        <h1>4moder</h1>

        <div class="subtitle">
            oneway4mo prime 😈
        </div>

        <div class="buttons">

            <a
                href="#"
                class="button primary"
            >
                Подключить бота
            </a>

            <a
                href="#"
                class="button"
            >
                Панель управления
            </a>

        </div>

        <div class="footer">
            oneway4mo prime
        </div>

    </div>

</body>
</html>
