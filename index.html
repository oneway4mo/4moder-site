<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            /* Углубленный, более тёмный бирюзово-синий радиальный градиент */
            background: radial-gradient(circle at center, #030f14 0%, #010306 100%);
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        .main-card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 720px;
            width: 90%;
            padding: 80px 70px;
            /* Более глубокий и тёмный тон карточки, чтобы добавить строгости */
            background: rgba(6, 11, 15, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.015);
            border-radius: 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
            box-sizing: border-box;
        }

        @keyframes neonPulse {
            0%   { box-shadow: 0 0 20px rgba(0, 242, 254, 0.25); border-color: #00f2fe; }
            50%  { box-shadow: 0 0 35px rgba(0, 242, 254, 0.5); border-color: #00e5ff; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.25); border-color: #00f2fe; }
        }

        .avatar {
            width: 130px;
            height: 130px;
            min-height: 130px;
            min-width: 130px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 4s infinite ease-in-out;
            margin-bottom: 28px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 58px;
            margin: 0 0 14px 0;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
            letter-spacing: -1px;
        }

        .description {
            font-size: 22px;
            color: #efeff1;
            margin: 0 0 50px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon {
            color: #030508;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #ffffff;
            color: #030508;
            box-shadow: 0 12px 35px rgba(0, 242, 254, 0.5);
        }

        .btn-outline {
            color: #ffffff;
            background: transparent;
            /* Слегка приглушенная рамка для идеального баланса */
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .btn-outline:hover {
            transform: translateY(-3px);
            background: rgba(0, 242, 254, 0.02);
            border-color: #00f2fe;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.2);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 78%;
                padding: 75px 25px;
                border-radius: 32px;
            }

            .avatar {
                width: 115px;
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 35px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 65px;
            }

            .btn {
                padding: 18px;
                font-size: 16px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon">Подключить бота</a>
            <a href="#" class="btn btn-outline">Панель управления</a>
        </div>
    </div>

</body>
</html>
