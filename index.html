<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @keyframes masterGlow {
            0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 0.45; transform: translate(-50%, -50%) scale(1.05); }
            100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.95); }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #030407; 
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(3, 28, 38, 0.3) 45%, rgba(0,0,0,0) 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: masterGlow 12s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            pointer-events: none;
            will-change: opacity, transform;
        }

        .main-card {
            text-align: center;
            max-width: 460px; 
            width: 90%;
            padding: 60px 45px; 
            background: rgba(13, 18, 26, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
            50% { box-shadow: 0 0 30px rgba(0, 242, 254, 0.5); border-color: #00e5ff; }
            100% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-height: 110px;
            min-width: 110px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            margin-bottom: 25px;
            object-fit: cover;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 44px;
            margin: 0 0 6px 0; 
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .description {
            font-size: 14px;
            color: #8e929a;
            margin: 0 0 45px 0;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px; 
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn i {
            font-size: 15px;
        }

        .btn-neon {
            color: #05070c;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .btn-neon:hover {
            transform: translateY(-3px) scale(1.01);
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
        }

        .btn-outline {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .btn-outline:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(0, 242, 254, 0.04);
            border-color: #00f2fe;
            color: #00f2fe;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.2);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 80%; 
                padding: 70px 25px; 
                border-radius: 24px; 
            }

            .avatar {
                width: 110px; 
                height: 110px;
                min-height: 110px;
                min-width: 110px;
                margin-bottom: 30px; 
            }

            h1 {
                font-size: 38px; 
                margin-bottom: 8px;
            }

            .description {
                font-size: 13px;
                margin-bottom: 60px; 
            }

            .btn {
                padding: 17px; 
                font-size: 13px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Подключить бота</a>
            <a href="#" class="btn btn-outline"><i class="fa-solid fa-gear"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
