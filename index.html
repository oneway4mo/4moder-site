<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        @keyframes smoothFloat {
            0% {
                transform: translate3d(-8%, -6%, 0) scale(1.05);
            }

            50% {
                transform: translate3d(8%, 6%, 0) scale(1.12);
            }

            100% {
                transform: translate3d(-8%, -6%, 0) scale(1.05);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background: #05070a;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Плавное свечение на всём экране */
        body::before {
            content: "";
            position: fixed;

            width: 140vw;
            height: 140vh;

            left: -20vw;
            top: -20vh;

            background:
                radial-gradient(
                    circle at 25% 35%,
                    rgba(0, 150, 190, 0.16) 0%,
                    rgba(0, 100, 140, 0.08) 25%,
                    transparent 55%
                ),
                radial-gradient(
                    circle at 75% 65%,
                    rgba(0, 220, 255, 0.10) 0%,
                    rgba(0, 100, 140, 0.04) 30%,
                    transparent 60%
                );

            filter: blur(70px);
            animation: smoothFloat 25s ease-in-out infinite;

            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .main-card {
            position: relative;
            z-index: 1;

            text-align: center;
            max-width: 580px;
            width: 95%;
            padding: 65px 55px;

            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 32px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.7);
        }

        @keyframes neonPulse {
            0% {
                box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
                border-color: #00f2fe;
            }

            50% {
                box-shadow: 0 0 35px rgba(0, 242, 254, 0.6);
                border-color: #00e5ff;
            }

            100% {
                box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
                border-color: #00f2fe;
            }
        }

        .avatar {
            width: 120px;
            height: 120px;
            min-height: 120px;
            min-width: 120px;

            border-radius: 50%;
            border: 3px solid #00f2fe;

            animation: neonPulse 4s infinite ease-in-out;

            margin-bottom: 24px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 12px 0;
            font-weight: 800;

            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 20px;
            color: #efeff1;

            margin: 0 0 45px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 18px;
            border-radius: 16px;

            font-size: 16px;
            font-weight: 700;
            text-decoration: none;

            width: 100%;
            transition: all 0.25s ease;
        }

        .btn-neon {
            color: #0b0c10;
            background: #00f2fe;
            border: 1px solid #00f2fe;

            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-neon:hover {
            transform: translateY(-3px);

            background: #ffffff;
            border-color: #ffffff;
            color: #0b0c10;

            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6);
        }

        .btn-outline {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.01);

            border: 1px solid rgba(0, 242, 254, 0.35);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.05);
        }

        .btn-outline:hover {
            transform: translateY(-3px);

            background: rgba(0, 242, 254, 0.03);
            border-color: #00f2fe;
            color: #00f2fe;

            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.25);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 85%;
                padding: 65px 25px;
                border-radius: 32px;
            }

            .avatar {
                width: 120px;
                height: 120px;
                min-height: 120px;
                min-width: 120px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 55px;
            }

            .btn {
                padding: 20px;
                font-size: 17px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            .avatar {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">

        <img
            class="avatar"
            src="logo.png"
            alt="4moder Logo"
        >

        <h1>4moder</h1>

        <p class="description">
            oneway4mo prime 😈
        </p>

        <div class="links-container">

            <a href="#" class="btn btn-neon">
                Подключить бота
            </a>

            <a href="#" class="btn btn-outline">
                Панель управления
            </a>

        </div>

    </div>

</body>
</html>
