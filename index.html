<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background: #05070a;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Мягкое "дыхание" свечения вместо движения градиента.
           Никаких волн — просто плавное изменение яркости двух радиальных пятен. */
        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: -20%;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            filter: blur(120px);
            will-change: opacity, transform;
        }

        body::before {
            background: radial-gradient(
                circle at 30% 35%,
                rgba(0, 180, 220, 0.18) 0%,
                rgba(0, 120, 180, 0.08) 35%,
                rgba(0, 0, 0, 0) 70%
            );
            animation: breatheA 18s ease-in-out infinite;
        }

        body::after {
            background: radial-gradient(
                circle at 70% 65%,
                rgba(0, 220, 255, 0.12) 0%,
                rgba(0, 100, 160, 0.05) 40%,
                rgba(0, 0, 0, 0) 72%
            );
            animation: breatheB 22s ease-in-out infinite;
        }

        @keyframes breatheA {
            0%   { opacity: 0.6; transform: scale(1) translate(0, 0); }
            50%  { opacity: 1;   transform: scale(1.15) translate(2%, -2%); }
            100% { opacity: 0.6; transform: scale(1) translate(0, 0); }
        }

        @keyframes breatheB {
            0%   { opacity: 0.5; transform: scale(1.05) translate(0, 0); }
            50%  { opacity: 0.9; transform: scale(0.95) translate(-2%, 2%); }
            100% { opacity: 0.5; transform: scale(1.05) translate(0, 0); }
        }

        .main-card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 720px;
            width: 90%;
            padding: 80px 70px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 36px;
            backdrop-filter: blur(15px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75);
            box-sizing: border-box;
        }

        @keyframes neonPulse {
            0%   { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
            50%  { box-shadow: 0 0 35px rgba(0, 242, 254, 0.6); border-color: #00e5ff; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
        }

        .avatar {
            width: 130px;
            height: 130px;
            min-height: 130px;
            min-width: 130px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 4s infinite ease-in-out;
            margin-bottom: 28px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 58px;
            margin: 0 0 14px 0;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            letter-spacing: -1px;
        }

        .description {
            font-size: 22px;
            color: #efeff1;
            margin: 0 0 50px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon {
            color: #0b0c10;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 12px 35px rgba(0, 242, 254, 0.6);
        }

        .btn-outline {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(0, 242, 254, 0.35);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.05);
        }

        .btn-outline:hover {
            transform: translateY(-3px);
            background: rgba(0, 242, 254, 0.03);
            border-color: #00f2fe;
            color: #00f2fe;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.25);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 78%;
                padding: 75px 25px;
                border-radius: 32px;
            }

            .avatar {
                width: 115px;
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 35px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 65px;
            }

            .btn {
                padding: 18px;
                font-size: 16px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Подключить бота</a>
            <a href="#" class="btn btn-outline"><i class="fa-solid fa-chart-simple"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
