<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Идеально плавная бесконечная анимация перелива */
        @keyframes slowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #040508, #0b0c10, #031c26, #0b0c10, #05070a);
            background-size: 300% 300%;
            animation: slowGradient 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Базовые стили карточки для ПК */
        .main-card {
            text-align: center;
            max-width: 480px; 
            width: 90%;
            padding: 50px 45px; 
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        /* Мягкий пульс для аватарки */
        @keyframes neonPulse {
            0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
            50% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.6); border-color: #00e5ff; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-height: 110px;
            min-width: 110px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 4s infinite ease-in-out;
            margin-bottom: 20px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 18px;
            color: #efeff1;
            margin: 0 0 35px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
        }

        .btn-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px; 
            color: #0b0c10;
            text-decoration: none;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6);
        }

        /* 📱 НАСТРОЙКА ТОЛЬКО ДЛЯ ТЕЛЕФОНОВ (ширина экрана меньше 600px) */
        @media (max-width: 600px) {
            .main-card {
                width: 85%; /* Делаем карточку уже, чтобы была компактнее по бокам */
                padding: 65px 25px; /* Сильно увеличиваем вертикальные отступы — тянем вверх и вниз */
                border-radius: 32px; /* Чуть сильнее закругляем углы для мобильного стиля */
            }

            .avatar {
                width: 120px; /* На мобилках аватарку делаем даже чуть заметнее */
                height: 120px;
                min-height: 120px;
                min-width: 120px;
                margin-bottom: 30px; /* Больше отступ до имени */
            }

            h1 {
                font-size: 38px; /* Немного уменьшаем шрифт, чтобы имя не ломало строки */
                margin-bottom: 15px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 55px; /* Делаем гигантский отступ до кнопки, вытягивая карточку вертикально */
            }

            .btn-neon {
                padding: 20px; /* Кнопку на мобилке делаем жирнее, чтобы было мега-удобно нажимать */
                font-size: 17px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
