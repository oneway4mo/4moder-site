<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @keyframes purpleFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #030305, #10061c, #06060a, #160426, #030305);
            background-size: 300% 300%;
            animation: purpleFlow 20s ease-in-out infinite;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        .wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 460px;
        }

        /* 😈 ИСПРАВЛЕННЫЕ ОСТРЫЕ РОГА ЧЕРТА */
        .devil-horns {
            position: absolute;
            top: -65px; /* Идеальная посадка рогов над краем панели */
            width: 100%;
            height: auto;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(168, 38, 255, 0.9)) drop-shadow(0 0 35px rgba(168, 38, 255, 0.5));
        }

        .devil-horns path {
            stroke: #a826ff;
            stroke-width: 5; /* Сделал линии жирнее и отчетливее */
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .main-card {
            text-align: center;
            width: 90%;
            padding: 50px 45px; 
            background: rgba(10, 10, 13, 0.85);
            border: 1px solid rgba(168, 38, 255, 0.2);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 38, 255, 0.1);
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        @keyframes purplePulse {
            0% { box-shadow: 0 0 20px rgba(168, 38, 255, 0.3); border-color: #a826ff; }
            50% { box-shadow: 0 0 35px rgba(168, 38, 255, 0.6); border-color: #df99ff; }
            100% { box-shadow: 0 0 20px rgba(168, 38, 255, 0.3); border-color: #a826ff; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-height: 110px;
            min-width: 110px;
            border-radius: 50%;
            border: 3px solid #a826ff;
            animation: purplePulse 4s infinite ease-in-out;
            margin-bottom: 20px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(168, 38, 255, 0.3);
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .description {
            font-size: 18px;
            color: #efeff1;
            margin: 0 0 35px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
        }

        .btn-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px; 
            color: #ffffff;
            text-decoration: none;
            background: #a826ff; 
            border: 1px solid #a826ff;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(168, 38, 255, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #ffffff;
            color: #10061c;
            box-shadow: 0 10px 30px rgba(168, 38, 255, 0.6);
        }

        /* Мобилки: узко, рожки пропорционально встают на место */
        @media (max-width: 600px) {
            .wrapper {
                width: 100%;
            }

            .devil-horns {
                top: -55px;
                width: 92%;
            }

            .main-card {
                width: 80% !important; /* Принудительно заужаем */
                padding: 65px 25px !important;
                border-radius: 24px;
            }

            .avatar {
                width: 115px;
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 60px;
            }

            .btn-neon {
                padding: 18px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Новый, симметричный чертеж острых рогов -->
        <svg class="devil-horns" viewBox="0 0 400 200">
            <!-- Левый рог: идет из центра вверх-влево и резко заменяется острым концом наружу -->
            <path d="M 155,90 C 150,50 120,25 90,20 C 115,35 130,65 135,95" />
            <!-- Правый рог: зеркальное отражение правого рога чертика -->
            <path d="M 245,90 C 250,50 280,25 310,20 C 285,35 270,65 265,95" />
        </svg>

        <div class="main-card">
            <img class="avatar" src="logo.png" alt="4moder Logo">
            <h1>4moder</h1>
            <p class="description">oneway4mo prime 😈</p>

            <div class="links-container">
                <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Панель управления</a>
            </div>
        </div>
    </div>

</body>
</html>
