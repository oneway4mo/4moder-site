<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Плавное движение фиолетового неонового тумана на фоне */
        @keyframes purpleFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            /* Глубокий черный и неоново-фиолетовые переливы */
            background: linear-gradient(135deg, #040406, #12071f, #08080c, #1a052e, #040406);
            background-size: 300% 300%;
            animation: purpleFlow 20s ease-in-out infinite;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Контейнер для центрирования карточки и рожек */
        .wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }

        /* 😈 НЕОНОВЫЕ РОЖКИ И УШКИ НА ЗАДНЕМ ПЛАНЕ */
        .devil-horns {
            position: absolute;
            top: -95px; /* Выносим рожки ровно над карточкой */
            width: 115%; /* Слегка шире карточки, чтобы ушки торчали по бокам */
            height: auto;
            z-index: 1; /* Прячем под карточку */
            pointer-events: none;
            /* Эффект яркого неонового свечения линий */
            filter: drop-shadow(0 0 15px rgba(160, 32, 240, 0.8)) drop-shadow(0 0 30px rgba(160, 32, 240, 0.4));
        }

        .devil-horns path {
            stroke: #b026ff; /* Цвет неоновых линий */
            stroke-width: 3.5;
            stroke-linecap: round;
            fill: none;
        }

        /* Главная карточка */
        .main-card {
            text-align: center;
            width: 90%;
            padding: 50px 45px; 
            background: rgba(10, 10, 13, 0.8); /* Чуть темнее, чтобы рожки контрастировали */
            border: 1px solid rgba(176, 38, 255, 0.15); /* Едва заметный фиолетовый контур */
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8), 0 0 40px rgba(176, 38, 255, 0.1);
            position: relative;
            z-index: 2; /* Карточка перекрывает основание рожек */
            box-sizing: border-box;
        }

        /* Мягкая пульсация аватарки в фиолетовом неоне */
        @keyframes purplePulse {
            0% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.3); border-color: #b026ff; }
            50% { box-shadow: 0 0 35px rgba(176, 38, 255, 0.6); border-color: #df99ff; }
            100% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.3); border-color: #b026ff; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-height: 110px;
            min-width: 110px;
            border-radius: 50%;
            border: 3px solid #b026ff;
            animation: purplePulse 4s infinite ease-in-out;
            margin-bottom: 20px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .description {
            font-size: 18px;
            color: #efeff1;
            margin: 0 0 35px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
        }

        /* Фиолетовая неоновая кнопка */
        .btn-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px; 
            color: #ffffff;
            text-decoration: none;
            background: #b026ff; 
            border: 1px solid #b026ff;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(176, 38, 255, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #ffffff;
            color: #12071f;
            box-shadow: 0 10px 30px rgba(176, 38, 255, 0.6);
        }

        /* 📱 МОБИЛЬНАЯ АДАПТАЦИЯ (Узкая, высокая, рожки пропорционально сжимаются) */
        @media (max-width: 600px) {
            .wrapper {
                max-width: 100%;
                width: 100%;
            }

            .devil-horns {
                top: -85px;
                width: 110%;
            }

            .main-card {
                width: 82% !important;
                padding: 65px 25px !important;
                border-radius: 24px;
            }

            .avatar {
                width: 115px;
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 60px;
            }

            .btn-neon {
                padding: 18px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- 😈 Математически точный SVG чертеж рожек и ушек, как ты нарисовал -->
        <svg class="devil-horns" viewBox="0 0 400 200">
            <!-- Левое ухо -->
            <path d="M 60,160 Q 20,60 70,80 Q 90,90 95,140" />
            <!-- Левый рог -->
            <path d="M 125,120 Q 110,20 145,30 Q 160,35 160,100" />
            <!-- Правый рог -->
            <path d="M 275,120 Q 290,20 255,30 Q 240,35 240,100" />
            <!-- Правое ухо -->
            <path d="M 340,160 Q 380,60 330,80 Q 310,90 305,140" />
        </svg>

        <!-- Сама панель бота -->
        <div class="main-card">
            <img class="avatar" src="logo.png" alt="4moder Logo">
            <h1>4moder</h1>
            <p class="description">oneway4mo prime 😈</p>

            <div class="links-container">
                <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Панель управления</a>
            </div>
        </div>
    </div>

</body>
</html>
