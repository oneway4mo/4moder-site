<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Идеально плавная цикличная анимация дыхания цвета без рваных швов */
        @keyframes ultraSmooth {
            0% { opacity: 0.3; }
            50% { opacity: 0.85; }
            100% { opacity: 0.3; }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #040508; /* Насыщенная темная база */
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Дополнительный слой для создания эффекта глубокого бирюзового перелива */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, #031c26 0%, #040508 80%);
            z-index: 0;
            animation: ultraSmooth 12s ease-in-out infinite;
            will-change: opacity; /* Включает максимальное сглаживание видеокарты */
        }

        .main-card {
            text-align: center;
            max-width: 520px; 
            width: 90%;
            padding: 60px 50px; 
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
            50% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.6); border-color: #00e5ff; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); border-color: #00f2fe; }
        }

        .avatar {
            width: 115px;
            height: 115px;
            min-height: 115px;
            min-width: 115px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 4s infinite ease-in-out;
            margin-bottom: 22px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 46px;
            margin: 0 0 12px 0; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 19px;
            color: #efeff1;
            margin: 0 0 40px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 17px; 
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon {
            color: #0b0c10;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6);
        }

        .btn-outline {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.05);
        }

        .btn-outline:hover {
            transform: translateY(-2px);
            background: rgba(0, 242, 254, 0.03);
            border-color: #00f2fe;
            color: #00f2fe;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 78%; 
                padding: 85px 25px; 
                border-radius: 32px; 
            }

            .avatar {
                width: 115px; 
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 35px; 
            }

            h1 {
                font-size: 38px; 
                margin-bottom: 15px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 70px; 
            }

            .btn {
                padding: 18px; 
                font-size: 16px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Подключить бота</a>
            <a href="#" class="btn btn-outline"><i class="fa-solid fa-chart-simple"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
