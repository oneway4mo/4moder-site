<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030407; 
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.05) 0%, rgba(3, 28, 38, 0.12) 45%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 440px; 
            width: 90%;
            padding: 50px 40px; 
            background: #0d0f12; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        @keyframes neonPulse {
            0% { transform: scale(0.97); opacity: 0.35; }
            50% { transform: scale(1.02); opacity: 0.6; }
            100% { transform: scale(0.97); opacity: 0.35; }
        }

        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-wrap::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            z-index: 1;
            animation: neonPulse 12s ease-in-out infinite;
            pointer-events: none;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 6px 0; 
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            line-height: 1.1;
        }

        .description {
            font-size: 14px;
            color: #8e929a;
            margin: 0 0 40px 0;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-sizing: border-box;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px; 
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn i {
            font-size: 15px;
        }

        .btn-primary {
            background: #00f0ff; 
            color: #000000;
            border: none;
            border-radius: 14px;
            box-shadow: 0 0 0px rgba(0, 240, 255, 0);
            transition: 
                transform 0.15s cubic-bezier(0.2, 0, 0, 1), 
                box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1),
                background-color 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01); 
            background: #26f4ff; 
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.25); 
        }

        .btn-primary:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 240, 255, 0.15);
            transition: transform 0.05s linear; 
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(0, 240, 255, 0.25); 
            border-radius: 14px;
            transition: 
                border-color 0.2s cubic-bezier(0.2, 0, 0, 1),
                background-color 0.2s cubic-bezier(0.2, 0, 0, 1),
                transform 0.15s cubic-bezier(0.2, 0, 0, 1);
        }

        .btn-secondary:hover {
            border-color: rgba(0, 240, 255, 1); 
            background: rgba(0, 240, 255, 0.02); 
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(1px) scale(0.99);
            background: rgba(0, 240, 255, 0.06);
            transition: transform 0.05s linear;
        }

        /* 📱 ИДЕАЛЬНОЕ СИНХРОННОЕ СЖАТИЕ ДЛЯ МОБИЛОК */
        @media (max-width: 600px) {
            .main-card {
                width: 82%; 
                padding: 55px 30px; 
                border-radius: 20px; 
            }

            .avatar-wrap {
                width: 100px; 
                height: 100px;
                min-height: 100px;
                min-width: 100px;
                margin-bottom: 20px; 
            }

            h1 {
                font-size: 36px; 
                margin-bottom: 6px;
            }

            .description {
                font-size: 13px;
                margin-bottom: 45px; 
            }

            .btn {
                padding: 15px; 
                font-size: 12px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="avatar-wrap">
            <img class="avatar" src="logo.png" alt="4moder Logo">
        </div>
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-primary"><i class="fa-brands fa-twitch"></i> Подключить бота</a>
            <a href="#" class="btn btn-secondary"><i class="fa-solid fa-gear"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
