<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Трюк против кэша мобилы: заставляем браузер каждый раз проверять обновления -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Ультра-плавный бесконечный перелив неонового Розового и Бирюзового */
        @keyframes liquidNeon {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            /* Смесь глубокого темного, неонового бирюзового и ярко-розового */
            background: linear-gradient(-45deg, #050508, #09202b, #0b0c10, #2b0922, #050508);
            background-size: 400% 400%;
            animation: liquidNeon 15s ease-in-out infinite;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Карточка с двойным неоновым свечением */
        .main-card {
            text-align: center;
            max-width: 460px; 
            width: 90%;
            padding: 55px 40px; 
            background: rgba(10, 10, 15, 0.65);
            /* Градиентная неоновая рамка: бирюза переходит в розовый */
            border: 2px solid #00f2fe;
            border-image: linear-gradient(135deg, #00f2fe, #ff007f) 1;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15), 0 0 30px rgba(255, 0, 127, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Анимация пульсации аватарки между двумя цветами */
        @keyframes twinPulse {
            0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }
            50% { box-shadow: 0 0 35px rgba(255, 0, 127, 0.6); border-color: #ff007f; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }
        }

        .avatar {
            width: 115px;
            height: 115px;
            min-height: 115px;
            min-width: 115px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: twinPulse 5s infinite ease-in-out;
            margin-bottom: 25px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 46px;
            margin: 0 0 10px 0; 
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            /* Текст переливается бирюзово-розовым */
            background: linear-gradient(135deg, #ffffff 40%, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 20px;
            color: #ffffff;
            margin: 0 0 45px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .links-container {
            width: 100%;
        }

        /* Кнопка с градиентом от бирюзы к розовому */
        .btn-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px; 
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(0, 242, 254, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 0, 127, 0.6);
            letter-spacing: 0.5px;
        }

        /* 📱 МОБИЛЬНАЯ АДАПТАЦИЯ (Узкая и вытянутая вертикально) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .main-card {
                width: 82% !important; /* Принудительно зажимаем ширину на мобилке */
                padding: 70px 25px !important; /* Растягиваем карту по вертикали */
                border-image: linear-gradient(135deg, #00f2fe, #ff007f) 1;
                border-radius: 0px; /* Специфика border-image на некоторых мобилках */
            }

            .avatar {
                width: 125px;
                height: 125px;
                min-height: 125px;
                min-width: 125px;
                margin-bottom: 35px;
            }

            h1 {
                font-size: 40px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 18px;
                margin-bottom: 65px; /* Создаем пустое вертикальное пространство до кнопки */
            }

            .btn-neon {
                padding: 20px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
