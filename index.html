<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Медленный, едва заметный туманный перелив нежных пастельных тонов */
        @keyframes softFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            /* Нежно-розовый, пастельно-голубой и очень глубокий темный для базы */
            background: linear-gradient(135deg, #050608, #0c151c, #1a1218, #0c151c, #050608);
            background-size: 300% 300%;
            animation: softFlow 25s ease-in-out infinite;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Элегантная карточка из аккуратного матового стекла */
        .main-card {
            text-align: center;
            max-width: 440px; 
            width: 90%;
            padding: 50px 40px; 
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.07); /* Едва заметный тонкий контур */
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        /* Мягкое мерцание аватарки между нежно-голубым и нежно-розовым */
        @keyframes pastelPulse {
            0% { box-shadow: 0 0 20px rgba(174, 223, 255, 0.2); border-color: #aedfff; }
            50% { box-shadow: 0 0 25px rgba(255, 194, 214, 0.3); border-color: #ffc2d6; }
            100% { box-shadow: 0 0 20px rgba(174, 223, 255, 0.2); border-color: #aedfff; }
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-height: 110px;
            min-width: 110px;
            border-radius: 50%;
            border: 2px solid #aedfff;
            animation: pastelPulse 6s infinite ease-in-out;
            margin-bottom: 25px;
            object-fit: cover;
            display: inline-block;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0; 
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .description {
            font-size: 18px;
            color: #efeff1;
            margin: 0 0 40px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
        }

        /* Стильная однотонная кнопка с нежным пастельно-голубым свечением */
        .btn-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px; 
            color: #0b0c10;
            text-decoration: none;
            background: #aedfff; /* Мягкий нежно-голубой */
            border: 1px solid #aedfff;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(174, 223, 255, 0.25);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            background: #ffffff; /* При наведении плавно переходит в чистый белый */
            border-color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 194, 214, 0.4); /* Подсветка меняется на нежно-розовую */
        }

        /* 📱 МОБИЛЬНАЯ ВЕРСИЯ: Строго узкая и вытянутая вверх/вниз */
        @media (max-width: 600px) {
            .main-card {
                width: 78% !important; /* Сильно заужаем по бокам */
                padding: 65px 25px !important; /* Увеличиваем высоту за счет внутренних отступов */
                border-radius: 24px !important;
            }

            .avatar {
                width: 115px;
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 12px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 60px; /* Вытягиваем пустое пространство до кнопки */
            }

            .btn-neon {
                padding: 18px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
