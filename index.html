```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4moder — oneway4mo prime</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        /* ==========================================
           БАЗА
           ========================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }


        body {
            position: relative;
            isolation: isolate;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #040508;

            color: #f5f5f7;

            font-family:
                'Inter',
                'Segoe UI',
                Helvetica,
                Arial,
                sans-serif;
        }


        /* ==========================================
           МЯГКОЕ СВЕЧЕНИЕ

           Здесь НЕТ:
           - moving gradient
           - background-position
           - полос
           - волн
           - перемещения цветных слоёв

           Свет находится за пределами экрана
           и только слегка "дышит".
           ========================================== */


        body::before {
            content: "";

            position: fixed;

            z-index: -2;

            left: 50%;
            top: 50%;

            width: 180vw;
            height: 180vw;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 150, 190, 0.095) 0%,
                    rgba(0, 120, 160, 0.055) 18%,
                    rgba(0, 90, 130, 0.025) 34%,
                    transparent 62%
                );

            filter: blur(100px);

            opacity: 0.72;

            animation:
                softBreathing 18s ease-in-out infinite;
        }


        body::after {
            content: "";

            position: fixed;

            z-index: -3;

            left: 50%;
            top: 50%;

            width: 200vw;
            height: 200vw;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(35, 55, 120, 0.035) 0%,
                    rgba(35, 55, 120, 0.018) 28%,
                    transparent 58%
                );

            filter: blur(130px);

            opacity: 0.65;

            animation:
                softBreathing2 26s ease-in-out infinite;
        }


        @keyframes softBreathing {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(0.97);

                opacity: 0.65;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.03);

                opacity: 0.80;
            }
        }


        @keyframes softBreathing2 {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(0.985);

                opacity: 0.58;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.015);

                opacity: 0.72;
            }
        }


        /* ==========================================
           КАРТОЧКА
           ========================================== */

        .main-card {

            text-align: center;

            max-width: 720px;

            width: 90%;

            padding: 80px 70px;

            background:
                rgba(255, 255, 255, 0.012);

            border:
                1px solid rgba(255, 255, 255, 0.045);

            border-radius: 36px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.75);

            position: relative;

            z-index: 5;
        }


        /* ==========================================
           АВАТАР
           ========================================== */

        .avatar {
            width: 130px;
            height: 130px;

            min-width: 130px;
            min-height: 130px;

            border-radius: 50%;

            border:
                3px solid #00f2fe;

            animation:
                neonPulse 4s ease-in-out infinite;

            margin-bottom: 28px;

            object-fit: cover;

            display: inline-block;
        }


        @keyframes neonPulse {

            0% {
                box-shadow:
                    0 0 20px rgba(0, 242, 254, 0.25);

                border-color:
                    #00eaf5;
            }

            50% {
                box-shadow:
                    0 0 32px rgba(0, 242, 254, 0.48);

                border-color:
                    #00f2fe;
            }

            100% {
                box-shadow:
                    0 0 20px rgba(0, 242, 254, 0.25);

                border-color:
                    #00eaf5;
            }
        }


        /* ==========================================
           ЗАГОЛОВОК
           ========================================== */

        h1 {

            font-size: 58px;

            margin:
                0 0 14px 0;

            font-weight: 800;

            text-shadow:
                0 0 20px rgba(0, 242, 254, 0.25);

            letter-spacing: -1px;
        }


        /* ==========================================
           ОПИСАНИЕ
           ========================================== */

        .description {

            font-size: 22px;

            color:
                #efeff1;

            margin:
                0 0 50px 0;

            font-weight: 600;

            letter-spacing: 0.5px;
        }


        /* ==========================================
           КНОПКИ
           ========================================== */

        .links-container {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        .btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;

            padding: 20px;

            border-radius: 18px;

            font-size: 17px;

            font-weight: 700;

            text-decoration: none;

            width: 100%;

            box-sizing: border-box;

            transition:
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }


        /* ==========================================
           ИКОНКИ
           ========================================== */

        .btn i {
            font-size: 18px;
        }


        /* ==========================================
           ОСНОВНАЯ КНОПКА
           ========================================== */

        .btn-neon {

            color:
                #071014;

            background:
                #00f2fe;

            border:
                1px solid #00f2fe;

            box-shadow:
                0 4px 20px rgba(0, 242, 254, 0.30);
        }


        .btn-neon:hover {

            transform:
                translateY(-3px);

            background:
                #ffffff;

            border-color:
                #ffffff;

            color:
                #0b0c10;

            box-shadow:
                0 12px 35px rgba(0, 242, 254, 0.55);
        }


        /* ==========================================
           ВТОРАЯ КНОПКА
           ========================================== */

        .btn-outline {

            color:
                #ffffff;

            background:
                rgba(255, 255, 255, 0.012);

            border:
                1px solid rgba(0, 242, 254, 0.35);

            box-shadow:
                0 0 10px rgba(0, 242, 254, 0.05);
        }


        .btn-outline:hover {

            transform:
                translateY(-3px);

            background:
                rgba(0, 242, 254, 0.035);

            border-color:
                #00f2fe;

            color:
                #00f2fe;

            box-shadow:
                0 6px 20px rgba(0, 242, 254, 0.25);
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 600px) {

            .main-card {

                width: 78%;

                padding:
                    75px 25px;

                border-radius:
                    32px;
            }


            .avatar {

                width: 115px;
                height: 115px;

                min-width: 115px;
                min-height: 115px;

                margin-bottom:
                    35px;
            }


            h1 {

                font-size:
                    38px;

                margin-bottom:
                    12px;
            }


            .description {

                font-size:
                    17px;

                margin-bottom:
                    65px;
            }


            .btn {

                padding:
                    18px;

                font-size:
                    16px;

                border-radius:
                    18px;
            }
        }


        /* ==========================================
           REDUCED MOTION
           ========================================== */

        @media (prefers-reduced-motion: reduce) {

            body::before,
            body::after,
            .avatar {

                animation:
                    none;
            }

            .btn {

                transition:
                    none;
            }
        }

    </style>
</head>


<body>

    <div class="main-card">

        <img
            class="avatar"
            src="logo.png"
            alt="4moder Logo"
        >


        <h1>
            4moder
        </h1>


        <p class="description">
            oneway4mo prime 😈
        </p>


        <div class="links-container">

            <a
                href="#"
                class="btn btn-neon"
            >
                <i class="fa-brands fa-twitch"></i>
                Подключить бота
            </a>


            <a
                href="#"
                class="btn btn-outline"
            >
                <i class="fa-solid fa-chart-simple"></i>
                Панель управления
            </a>

        </div>

    </div>

</body>
</html>
```
