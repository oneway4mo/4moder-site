<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4moder — oneway4mo prime</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030508;
            color: #f5f5f7;
            font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Дорогая футуристичная сетка на фоне */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            z-index: 0;
            pointer-events: none;
        }

        /* Две неподвижные мягкие неоновые сферы для объема без лагов */
        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 30%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 95, 115, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 25%;
            z-index: 0;
            pointer-events: none;
        }

        /* Премиальная стеклянная панель */
        .main-card {
            text-align: center;
            max-width: 520px; 
            width: 90%;
            padding: 60px 50px; 
            background: linear-gradient(135deg, rgba(13, 17, 23, 0.6) 0%, rgba(6, 8, 12, 0.75) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.25); border-color: #00f2fe; }
            50% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.55); border-color: #00e5ff; }
            100% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.25); border-color: #00f2fe; }
        }

        .avatar {
            width: 115px;
            height: 115px;
            min-height: 115px;
            min-width: 115px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            animation: neonPulse 4s infinite ease-in-out;
            margin-bottom: 22px;
            object-fit: cover;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 46px;
            margin: 0 0 12px 0; 
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #d2d4d9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 19px;
            color: #adadb8;
            margin: 0 0 40px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 17px; 
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon {
            color: #0b0c10;
            background: #00f2fe;
            border: 1px solid #00f2fe;
            box-shadow: 0 4px 25px rgba(0, 242, 254, 0.35);
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 12px 35px rgba(0, 242, 254, 0.65);
        }

        /* Дорогая матовая кнопка из темного стекла */
        .btn-outline {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-outline:hover {
            transform: translateY(-2px);
            background: rgba(0, 242, 254, 0.03);
            border-color: rgba(0, 242, 254, 0.8);
            color: #00f2fe;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.2);
        }

        @media (max-width: 600px) {
            .main-card {
                width: 78%; 
                padding: 85px 25px; 
                border-radius: 32px; 
            }

            .avatar {
                width: 115px; 
                height: 115px;
                min-height: 115px;
                min-width: 115px;
                margin-bottom: 35px; 
            }

            h1 {
                font-size: 38px; 
                margin-bottom: 15px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 70px; 
            }

            .btn {
                padding: 18px; 
                font-size: 16px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Слои неонового свечения за картой -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="main-card">
        <img class="avatar" src="logo.png" alt="4moder Logo">
        <h1>4moder</h1>
        <p class="description">oneway4mo prime 😈</p>

        <div class="links-container">
            <a href="#" class="btn btn-neon"><i class="fa-brands fa-twitch"></i> Подключить бота</a>
            <a href="#" class="btn btn-outline"><i class="fa-solid fa-chart-simple"></i> Панель управления</a>
        </div>
    </div>

</body>
</html>
