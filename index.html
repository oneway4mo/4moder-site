<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4moder — oneway4mo prime</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;

            background: #040508;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;

            overflow-x: hidden;
            position: relative;

            animation: backgroundBreathing 14s ease-in-out infinite;
        }

        /* Очень мягкая статичная подсветка.
           Ничего не двигается — поэтому никаких волн и полос. */
        body::before {
            content: "";
            position: fixed;
            z-index: 0;

            width: 160vw;
            height: 160vw;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(0, 242, 254, 0.035) 0%,
                    rgba(0, 150, 190, 0.018) 25%,
                    transparent 60%
                );

            filter: blur(100px);
            pointer-events: none;

            animation: glowOpacity 16s ease-in-out infinite;
        }

        /* Вторая практически незаметная подсветка */
        body::after {
            content: "";
            position: fixed;
            z-index: 0;

            width: 180vw;
            height: 180vw;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(0, 100, 180, 0.025) 0%,
                    transparent 58%
                );

            filter: blur(140px);
            pointer-events: none;

            animation: glowOpacity2 22s ease-in-out infinite;
        }

        @keyframes backgroundBreathing {
            0%,
            100% {
                background-color: #040508;
            }

            50% {
                background-color: #05080b;
            }
        }

        @keyframes glowOpacity {
            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 0.8;
            }
        }

        @keyframes glowOpacity2 {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 0.7;
            }
        }

        .main-card {
            position: relative;
            z-index: 1;

            width: 90%;
            max-width: 720px;

            padding: 80px 70px;

            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 36px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            text-align: center;
        }

        .avatar {
            width: 130px;
            height: 130px;

            margin: 0 auto 28px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #00f2fe;

            box-shadow:
                0 0 20px rgba(0, 242, 254, 0.35);

            animation: neonPulse 4s ease-in-out infinite;
        }

        @keyframes neonPulse {
            0%,
            100% {
                box-shadow:
                    0 0 18px rgba(0, 242, 254, 0.25);
            }

            50% {
                box-shadow:
                    0 0 30px rgba(0, 242, 254, 0.45);
            }
        }

        h1 {
            font-size: 58px;
            line-height: 1.05;

            margin-bottom: 18px;

            font-weight: 800;
            letter-spacing: -2px;

            color: #ffffff;

            text-shadow:
                0 0 18px rgba(0, 242, 254, 0.25);
        }

        .description {
            font-size: 22px;
            line-height: 1.5;

            color: rgba(255, 255, 255, 0.65);

            margin-bottom: 42px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            min-height: 62px;

            padding: 16px 24px;

            border-radius: 16px;

            font-size: 18px;
            font-weight: 700;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button.primary {
            color: #001014;

            background: #00f2fe;

            box-shadow:
                0 10px 30px rgba(0, 242, 254, 0.18);
        }

        .button.primary:hover {
            background: #26f4ff;

            box-shadow:
                0 14px 35px rgba(0, 242, 254, 0.28);
        }

        .button.secondary {
            color: #ffffff;

            background: rgba(255, 255, 255, 0.035);

            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .button.secondary:hover {
            background: rgba(255, 255, 255, 0.07);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .button i {
            font-size: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            .main-card {
                width: 100%;
                padding: 55px 25px;
                border-radius: 28px;
            }

            .avatar {
                width: 105px;
                height: 105px;
                margin-bottom: 24px;
            }

            h1 {
                font-size: 42px;
                letter-spacing: -1.5px;
            }

            .description {
                font-size: 18px;
                margin-bottom: 32px;
            }

            .button {
                min-height: 58px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="main-card">

        <img
            class="avatar"
            src="https://i.imgur.com/your-image.png"
            alt="oneway4mo"
        >

        <h1>4moder</h1>

        <p class="description">
            oneway4mo prime
        </p>

        <div class="buttons">

            <a href="#" class="button primary">
                <i class="fa-brands fa-twitch"></i>
                Подключить бота
            </a>

            <a href="#" class="button secondary">
                <i class="fa-solid fa-gear"></i>
                Панель управления
            </a>

        </div>

    </main>

</body>
</html>
